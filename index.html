<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hapaul Apps</title>
  <meta name="description" content="Hapaul Apps — Lisiur Day 打造的原创应用 · Original apps by Lisiur Day.">
  <link rel="alternate" hreflang="zh-Hans" href="https://apps.hapaul.top/zh-CN/">
  <link rel="alternate" hreflang="en-US" href="https://apps.hapaul.top/en-US/">
  <link rel="alternate" hreflang="x-default" href="https://apps.hapaul.top/">
  <script>
  (function () {
    var lang = null;
    try {
      var saved = localStorage.getItem('hapaul-lang');
      if (saved === 'zh-CN' || saved === 'en-US') lang = saved;
    } catch (e) {}
    if (!lang) {
      var candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (var i = 0; i < candidates.length; i++) {
        if (/^zh/i.test(candidates[i] || '')) { lang = 'zh-CN'; break; }
      }
    }
    location.replace((lang || 'en-US') + '/');
  })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lang-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 48px 56px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
    }
    .lang-picker h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    .lang-picker nav { display: flex; gap: 16px; }
    .lang-picker a {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 24px;
      font-size: 15px;
      color: #f5f5f7;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .lang-picker a:hover { border-color: rgba(0,122,255,0.5); background: rgba(255,255,255,0.06); }
  </style>
</head>
<body>
  <main class="lang-picker">
    <h1>Hapaul Apps</h1>
    <nav>
      <a href="zh-CN/">中文</a>
      <a href="en-US/">English</a>
    </nav>
  </main>
</body>
</html>
